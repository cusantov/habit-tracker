<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Трекер привычек</title>
  <!-- Иконка встроена, чтобы браузер не запрашивал favicon.ico и в консоли не было 404 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2322a06b'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <!-- defer: скрипт выполнится после разбора страницы, но тему выставит до первого показа -->
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Градиенты огонька объявлены один раз здесь: если держать их внутри карточки,
       а первая карточка без серии скрыта, ссылки на градиент у остальных ломаются -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="flame-outer" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffc21a"/>
        <stop offset="0.45" stop-color="#ff7a1a"/>
        <stop offset="1" stop-color="#fe2c55"/>
      </linearGradient>
      <linearGradient id="flame-inner" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff6c2"/>
        <stop offset="1" stop-color="#ffd13a"/>
      </linearGradient>
    </defs>
  </svg>

  <main class="app">
    <header class="app__header">
      <div>
        <h1 class="app__title">Трекер привычек</h1>
        <p class="app__date" id="today"></p>
        <p class="app__status" id="day-status" hidden>Все привычки на сегодня выполнены</p>
      </div>
      <div class="app__actions">
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Переключить тему">
        <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        </button>
      </div>
    </header>

    <p class="notice" id="notice" role="status" hidden></p>

    <form class="add-form" id="habit-form" novalidate autocomplete="off">
      <label class="visually-hidden" for="habit-input">Название привычки</label>
      <div class="add-form__row">
        <input class="add-form__input" id="habit-input" type="text" placeholder="Например, Зарядка">
        <button class="add-form__button" type="submit">Добавить</button>
      </div>
      <div class="add-form__meta">
        <p class="add-form__error" id="form-error" aria-live="polite"></p>
        <span class="add-form__counter" id="char-counter">0/50</span>
      </div>
    </form>

    <section class="habits" aria-label="Список привычек">
      <ul class="habit-list" id="habit-list"></ul>
      <p class="empty" id="empty-state" hidden>Пока нет привычек. Добавьте первую!</p>
    </section>

    <footer class="app__footer">
      <p class="stats" id="stats">Выполнено: 0 из 0</p>
      <div class="progress" aria-hidden="true">
        <div class="progress__fill" id="progress-fill"></div>
      </div>

      <div class="tools">
        <div class="tools__group">
          <!-- Пара зеркальных иконок: одинаковый лоток, стрелка из него вверх и в него вниз -->
          <button class="tool-btn" id="export-btn" type="button">
            <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
              <path d="M4 14.5v3A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5v-3M12 15V4M7.5 8.5L12 4l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Экспорт
          </button>
          <button class="tool-btn" id="import-btn" type="button">
            <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
              <path d="M4 14.5v3A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5v-3M12 4v11M7.5 10.5L12 15l4.5-4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Импорт
          </button>
          <input id="import-input" type="file" accept=".json,application/json" hidden>
        </div>

        <div class="reminder">
          <svg class="reminder__icon" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
            <path d="M12 3a5.5 5.5 0 0 0-5.5 5.5v3.3c0 .8-.25 1.6-.72 2.25l-.98 1.35A1 1 0 0 0 5.6 17h12.8a1 1 0 0 0 .8-1.6l-.98-1.35a3.9 3.9 0 0 1-.72-2.25V8.5A5.5 5.5 0 0 0 12 3zM9.75 19.5a2.3 2.3 0 0 0 4.5 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="reminder-label">Напомнить в</span>

          <!-- Своё колесо выбора времени вместо системного <input type="time"> -->
          <div class="time-field">
            <button class="time-chip" id="reminder-time" type="button" aria-haspopup="dialog" aria-expanded="false" aria-labelledby="reminder-label reminder-time">21:00</button>
            <div class="time-picker" id="time-picker" role="dialog" aria-label="Время напоминания" hidden>
              <div class="time-picker__wheels">
                <div class="wheel" id="wheel-hours" tabindex="0" aria-label="Часы"></div>
                <span class="time-picker__colon" aria-hidden="true">:</span>
                <div class="wheel" id="wheel-minutes" tabindex="0" aria-label="Минуты"></div>
              </div>
              <button class="time-picker__done" id="time-done" type="button">Готово</button>
            </div>
          </div>

          <button class="switch" id="reminder-toggle" type="button" role="switch" aria-checked="false" aria-label="Напоминание">
            <span class="switch__thumb"></span>
          </button>
        </div>
      </div>
      <p class="reminder__hint" id="reminder-hint"></p>
    </footer>
  </main>

  <!-- Плашка «Удалено · Отменить» после удаления привычки -->
  <div class="toast" id="toast" role="status" hidden>
    <span class="toast__text" id="toast-text"></span>
    <button class="toast__action" id="toast-undo" type="button">Отменить</button>
  </div>

  <!-- Шаблон карточки: клонируется в script.js, текст подставляется только через textContent -->
  <template id="habit-template">
    <li class="habit">
      <button class="habit__handle" type="button">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/>
          <circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/>
          <circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/>
        </svg>
      </button>
      <label class="habit__toggle">
        <input class="habit__checkbox" type="checkbox">
        <span class="habit__box" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16">
            <!-- pathLength="1" — чтобы анимировать прорисовку галочки от 1 до 0 -->
            <path d="M5 12.5l4.5 4.5L19 7.5" pathLength="1" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </label>
      <div class="habit__body">
        <div class="habit__head">
          <p class="habit__title"></p>
          <span class="habit__streak" hidden>
            <!-- Огонёк серии: пламя с завитком и светлым язычком внутри -->
            <svg class="habit__flame" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M12.3 1.8c.4 2.7 2.1 4.3 3.8 6 1.8 1.8 3.6 3.8 3.6 7a7.7 7.7 0 0 1-15.4 0c0-2.7 1.1-4.7 2.7-6.2.1 1.8.9 3 2.1 3.6-.4-4 1.1-7.9 3.2-10.4z" fill="url(#flame-outer)"/>
              <path d="M12.4 11.6c.2 1.5 1.1 2.4 2 3.3.8.8 1.4 1.8 1.4 3.1a3.8 3.8 0 0 1-7.6 0c0-1.4.6-2.4 1.5-3.2.1.8.5 1.3 1 1.6-.2-1.9.5-3.5 1.7-4.8z" fill="url(#flame-inner)"/>
            </svg>
            <span class="habit__streak-count"></span>
          </span>
        </div>
        <ol class="habit__week"></ol>
      </div>
      <button class="habit__delete" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </li>
  </template>
</body>
</html>
